<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doação - ONG Esperança</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>ONG Esperança</h1>

    <nav>
        <a href="início.html">Tela Inicial</a>
    </nav>
</header>

<main class="container">

    <section class="formulario">

        <h2>Faça sua contribuição</h2>

        <p>
            Sua contribuição pode ajudar a manter nossos projetos.
        </p>

        <p id="projeto" class="projeto-selecionado"></p>

        <form onsubmit="finalizarDoacao(event)">

            <label>Nome:</label>
            <input
                type="text"
                id="nome"
                placeholder="Digite seu nome"
                required
            >

            <label>E-mail:</label>
            <input
                type="email"
                id="email"
                placeholder="Digite seu e-mail"
                required
            >

            <label>Valor da doação:</label>
            <input
                type="number"
                id="valor"
                placeholder="Ex: 50"
                min="1"
                required
            >

            <button type="submit">
                Confirmar doação
            </button>

        </form>

        <span id="mensagem"></span>

    </section>

</main>

<script src="script.js"></script>
</body>
</html>
